name: Validar y publicar Impulso
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar cálculos y contenido
        run: npm test
      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html styles.css app.js core.js content.js icon.svg _site/
          cp -r public _site/public
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
